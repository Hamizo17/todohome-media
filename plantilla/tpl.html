<!doctype html><html><head><meta charset="utf-8"><style>

function pills(pref,a,b,off){let k=1,ids=[];while(el(pref+k)){ids.push(pref+k);k++}const n=ids.length;ids.forEach((id,i)=>{const s=a+.05+i*(b-a-.4)/n;el(id).style.transform=`translateX(${(1-bk((T-s)/.45))*off}px)`})}

 $("lg").style.transform=`translateY(${(1-eo((t-a7-.05)/.5))*80}px)`;$("lg").style.opacity=cl((t-a7-.05)/.4);

 const cur=W.findIndex(x=>t>=x.t0&&t<x.t1+.25&&x.line);let html="";
 if(cur>=0){const ln=W[cur].line,lw=W.filter(x=>x.line===ln),i=lw.indexOf(W[cur]),g=Math.floor(i/3)*3;

   html+=`<span class="${KEY.includes(clean)?"k":""}" style="opacity:${vis?1:0};transform:scale(${vis?.6+.4*bk((t-x.t0)/.25):.6})">${x.w}</span>`});}
 $("cap").innerHTML= t<a2||(t>=a4&&t<a5)||t>=a6? "" : html;
};
