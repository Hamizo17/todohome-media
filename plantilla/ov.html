<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:A;src:url(archivo.woff2) format("woff2");font-weight:100 900}
*{box-sizing:border-box;margin:0}
html,body{background:transparent}
body{width:1080px;height:1920px;overflow:hidden;font-family:A,sans-serif;color:#fff;position:relative}
.st{-webkit-text-stroke:14px #000;paint-order:stroke fill}
#bar{position:absolute;top:0;left:0;height:12px;background:#4BE08A}
#tag{position:absolute;top:70px;left:0;right:0;text-align:center}
#tag span{display:inline-block;background:rgba(0,0,0,.55);border-radius:999px;padding:12px 28px;font-size:34px;font-weight:600;color:#fff}
#hook{position:absolute;left:70px;right:70px;top:190px;text-align:center;font-weight:800;line-height:1.02;letter-spacing:-.02em}
#name{position:absolute;left:0;right:0;top:200px;display:flex;justify-content:center}
#name div{background:#fff;color:#1A1C1E;border-radius:36px;padding:26px 44px;font-weight:800;font-size:72px;text-align:center;line-height:1.05;max-width:960px;box-shadow:0 30px 70px rgba(0,0,0,.4)}
#name small{display:block;font-size:34px;font-weight:700;color:#1F7A47;letter-spacing:.12em;margin-bottom:8px}
#cap{position:absolute;left:60px;right:60px;top:1470px;text-align:center;font-weight:800;font-size:96px;line-height:1.05}
#cap span{display:inline-block;margin:0 .12em}
#cap .k{color:#4BE08A}
#end{position:absolute;inset:0;background:rgba(20,22,24,.8);opacity:0}
.big{position:absolute;left:60px;right:60px;text-align:center;font-weight:800;line-height:1.02;letter-spacing:-.02em}
.logo{display:flex;align-items:center;gap:26px;font-weight:800;font-size:84px}
.logo svg{width:120px;height:120px}
</style></head><body>
<div id="tag"><span>Imágenes orientativas del tipo de producto</span></div>
<div id="hook" class="st" style="font-size:__HOOKSIZE__px">__HOOK__</div>
<div id="name"><div><small>TODOHOME RECOMIENDA</small>__NAME__</div></div>
<div id="cap" class="st"></div>
<div id="end">
 <div id="e6">
  <div class="big" style="top:640px;font-size:76px;font-weight:600">Mira el precio en</div>
  <div class="big" id="amz" style="top:740px;font-size:250px;color:#4BE08A">Amazon</div>
  <div class="big" style="top:1040px;font-size:42px;font-weight:500;color:#C9CDD0">El precio lo marca Amazon</div>
 </div>
 <div id="e7">
  <div id="lg" style="position:absolute;top:560px;left:0;right:0;display:flex;justify-content:center"><div class="logo"><svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#fff"/><path d="M15 31 32 16l17 15h-4v17H19V31z" fill="#1A1C1E"/><rect x="28" y="37" width="8" height="11" rx="2" fill="#1F7A47"/></svg>TODOHOME</div></div>
  <div class="big" id="h7" style="top:800px;font-size:120px">Enlace en la bio</div>
  <div class="big" id="u7" style="top:970px;font-size:54px;font-weight:600;color:#4BE08A">todohome-es.vercel.app</div>
 </div>
</div>
<div id="bar"></div>
<script>
const TL=__TLJ__, D=__DUR__, ST=__ST__, KEY=__KEY__;
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), eo=x=>1-Math.pow(1-cl(x),4), bk=x=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const $=id=>document.getElementById(id);
function words(){const out=[];TL.forEach(l=>{const w=l.text.split(" ");const tot=w.reduce((a,x)=>a+x.length+1,0);let t=l.t0;w.forEach(x=>{const d=(l.t1-l.t0)*(x.length+1)/tot;out.push({w:x,t0:t,t1:t+d,line:l});t+=d})});return out}
const W=words();
window.seek=function(t){
 const [a1,a2,a3,a4,a5,a6,a7]=ST;
 $("bar").style.width=(t/D*100)+"%";
 $("tag").style.opacity=t<a6?1:0;
 $("hook").style.opacity=t<a2?cl((t-.05)/.2):0;$("hook").style.transform=`scale(${.6+.4*bk((t-.05)/.4)})`;
 const nk=t-a2;$("name").style.opacity=(t>=a2&&t<a3)?cl(nk/.15):0;$("name").style.transform=`translateY(${(1-bk(nk/.45))*-160}px)`;
 $("end").style.opacity=t>=a6?cl((t-a6)/.2):0;
 $("e6").style.opacity=t<a7?1:0;$("amz").style.transform=`scale(${.4+.6*bk((t-a6-.15)/.45)})`;
 $("e7").style.opacity=t>=a7?1:0;
 $("lg").style.transform=`translateY(${(1-eo((t-a7)/.5))*80}px)`;$("lg").style.opacity=cl((t-a7)/.3);
 $("h7").style.opacity=cl((t-a7-.25)/.3);$("u7").style.opacity=cl((t-a7-.6)/.3);
 const cur=W.findIndex(x=>t>=x.t0&&t<x.t1+.25);let html="";
 if(cur>=0){const ln=W[cur].line,lw=W.filter(x=>x.line===ln),i=lw.indexOf(W[cur]),g=Math.floor(i/3)*3;
  lw.slice(g,g+3).forEach(x=>{const vis=t>=x.t0;const clean=x.w.toLowerCase().replace(/[^a-záéíóúñ]/g,"");
   html+=`<span class="${KEY.includes(clean)?"k":""}" style="opacity:${vis?1:0};transform:scale(${vis?.6+.4*bk((t-x.t0)/.25):.6})">${x.w}</span>`});}
 $("cap").innerHTML=(t<a2||t>=a6)?"":html;
};
seek(0);
</script></body></html>
